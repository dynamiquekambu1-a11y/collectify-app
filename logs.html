<!doctype html>
<html>
<head>
<title>Logs</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

<h1 class="text-2xl font-bold mb-4">Email Logs</h1>

<a href="/run_now" class="bg-green-600 text-white px-4 py-2 rounded inline-block mb-4">
Run Check Now
</a>

<table class="w-full bg-white rounded shadow">

<tr class="bg-gray-100">
<th class="p-2">Client</th>
<th>Level</th>
<th>Status</th>
<th>Date</th>
</tr>

{% for l in logs %}
<tr class="border-t">
<td class="p-2">{{l['name']}}</td>
<td>{{l['level']}}</td>
<td>{{l['status']}}</td>
<td>{{l['sent_at']}}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
