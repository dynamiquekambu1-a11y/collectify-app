<!doctype html>
<html>
<head>
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-gray-100 p-6">

<h1 class="text-3xl font-bold mb-6">GetPaid Dashboard</h1>

<div class="grid grid-cols-3 gap-4 mb-6">

    <div class="bg-white p-4 rounded shadow">
        <div class="text-gray-500">Total Due</div>
        <div class="text-2xl font-bold">${{total_due}}</div>
    </div>

    <div class="bg-white p-4 rounded shadow">
        <div class="text-gray-500">Paid</div>
        <div class="text-2xl font-bold">${{total_paid}}</div>
    </div>

    <div class="bg-white p-4 rounded shadow">
        <div class="text-gray-500">Overdue</div>
        <div class="text-2xl font-bold text-red-600">{{overdue}}</div>
    </div>

</div>

<div class="space-x-3">
    <a href="/clients" class="bg-gray-700 text-white px-4 py-2 rounded">Clients</a>
    <a href="/add" class="bg-blue-600 text-white px-4 py-2 rounded">Add Debt</a>
    <a href="/logs" class="bg-green-600 text-white px-4 py-2 rounded">Logs</a>
</div>

</body>
</html>
