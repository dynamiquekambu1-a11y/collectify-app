<!doctype html>
<html>
<head>
<title>Add Client</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

<h1 class="text-2xl font-bold mb-4">Add Debt</h1>

<form method="POST" class="bg-white p-4 rounded shadow max-w-md">

<input name="name" placeholder="Name" class="w-full border p-2 mb-3" required>

<input name="email" type="email" placeholder="Email" class="w-full border p-2 mb-3" required>

<input name="debt" type="number" step="0.01" placeholder="Amount" class="w-full border p-2 mb-3" required>

<input name="due_date" type="date" class="w-full border p-2 mb-4" required>

<button class="bg-blue-600 text-white px-4 py-2 rounded">
Save
</button>

</form>

</body>
</html>
